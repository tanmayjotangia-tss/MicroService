spring.application.name=config-server

server.port=8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.config.server.git.uri=https://github.com/tanmayjotangia-tss/MicroConfigDemo.git
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.default-label=master


management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [%d{yyyy-MM-dd HH:mm:ss.SSS}] [%X{traceId:-},%X{spanId:-}] %c - %m%n

logging.level.org.springframework.web=DEBUG

management.zipkin.endpoint=http://localhost:9411/api/v2/spans